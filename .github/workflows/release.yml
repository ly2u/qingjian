name: Build and release Windows app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-native.ps1
      - run: npm run build
      - run: npm run test:browser
      - name: Prepare release archive
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "Qingjian-Windows-x64-v$version.zip"
          Copy-Item -LiteralPath '轻笺-Windows-x64.zip' -Destination $name
          $hash = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$name.sha256" -Value "$hash  $name" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: Qingjian-Windows-x64
          path: |
            Qingjian-Windows-x64-v*.zip
            Qingjian-Windows-x64-v*.zip.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") { throw 'Tag and package version must match.' }
          gh release create $tag "Qingjian-Windows-x64-v$version.zip" "Qingjian-Windows-x64-v$version.zip.sha256" --verify-tag --title "轻笺 $tag" --notes-file RELEASE_NOTES.md
